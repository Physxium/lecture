<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lecture Admin</title>

    <link rel="stylesheet" href="style.css" />
</head>

<body class="admin-page">

    <main class="admin-wrap">

        <h1>Lecture Control</h1>

        <section>
            <h2>슬라이드 목록</h2>

            <div id="slide-list"></div>
        </section>


        <section class="admin-question-section">
        
            <h2>질문 답변</h2>
        
            <div id="answer-list"></div>
        
        </section>

        <section class="admin-reset-section">
            <button id="reset-answers-button">
                답변 데이터 초기화
            </button>
        </section>

        <section class="admin-status-section">
        
            <h2>강의 상태</h2>
        
            <div class="admin-status-controls">
        
                <button id="set-live-button" type="button" class="admin-status-button">
                    LIVE
                </button>
        
                <button id="set-ended-button" type="button" class="admin-status-button">
                    종료
                </button>
        
            </div>
        
            <p id="lecture-status-text" class="admin-status-text">
                현재 상태 확인 중...
            </p>
        
        </section>

    </main>

    <script src="data/content.js"></script>
    <script src="js/admin.js"></script>

</body>

</html>
